workspaces:
  - name: codecarton.com-v2
    root: ~/Projects/codecarton.com-v2
    focus: true
    tabs:
      - label: code
        panes:
          - command: opencode
            focus: true
          - command: nvim
            split: right
      - label: server
        panes:
          - command: pnpm dev
          - split: down
            ratio: 0.3
      - label: git
        panes:
          - command: lazygit

  - name: Devote
    root: ~/Projects/Devote
    tabs:
      - label: code
        panes:
          - command: opencode
          - command: nvim
            split: right
      - label: git
        panes:
          - command: lazygit

